version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: thronova_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: thronova-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - root_default
      - default

  dashboard:
    container_name: thronova-dashboard
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /opt/thronova-storage:/opt/thronova-storage
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.thronova-dashboard.rule=Host(\`media.thronova.com\`)"
      - "traefik.http.routers.thronova-dashboard.entrypoints=websecure"
      - "traefik.http.routers.thronova-dashboard.tls=true"
      - "traefik.http.services.thronova-dashboard.loadbalancer.server.port=3000"

volumes:
  postgres_data:

networks:
  root_default:
    external: true
